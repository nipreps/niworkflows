name: Pre-release dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Force tox and pytest to use color
  FORCE_COLOR: true

jobs:
  get_data:
    if: github.repository == 'nipreps/niworkflows'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - name: Create test data directory
      run: mkdir -p $HOME/.cache/stanford-crn
    - name: Load test data cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: stanford-crn
      with:
        path: ~/.cache/stanford-crn/
        key: data-v0-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          data-v0-${{ github.ref_name }}-
          data-v0-
    - name: Setup conda
      uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
      with:
        auto-activate-base: true
        activate-environment: ""
    - name: Verify environment
      run: |
        conda info
        which python
    - name: Install datalad
      run: |
        python -m pip install datalad-installer
        datalad-installer --sudo ok git-annex
        python -m pip install datalad datalad-osf
        datalad wtf
    - name: Pacify git
      run: |
        git config --global user.email "github@niworkflows.ci"
        git config --global user.name "Niworkflows Action"
    - name: Fetch test data
      run: |
        DS=$HOME/.cache/stanford-crn
        datalad install -r -s https://github.com/nipreps-data/niworkflows-data.git $DS
        cd $DS
        git -C BIDS-examples-1-enh-ds054 checkout enh/ds054
        datalad update -r --merge -d .
        datalad get -J 2 -r ds000003 ds000030/sub-10228/func

  test:
    needs: [get_data]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    env:
      DEPENDS: pre

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Load test data cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: stanford-crn
        with:
          path: ~/.cache/stanford-crn/
          key: data-v0-${{ github.ref_name }}-${{ github.sha }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/templateflow
          key: templateflow-v1
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends graphviz
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install tox
        run: |
          uv tool install tox --with=tox-uv --with=tox-gh-actions
      - name: Show tox config
        run: tox c
      - name: Run tox
        run: tox -v --exit-and-dump-after 1200
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: ${{ always() }}

  create-issue-on-failure:
    name: Open issue on failure
    needs: [test]
    if: failure() && github.repository == 'nipreps/niworkflows' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = '[PRE] Upcoming dependency causing test failures';
            const body = [
              'The weekly pre-release dependency test run failed.',
              '',
              `Failing run: ${runUrl}`,
              '',
              'This job installs pre-release versions of dependencies. A failure here usually means',
              'an upcoming release of a dependency will break niworkflows.',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pre-release-failure',
            });

            if (issues.length > 0) {
              const issue = issues[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Another scheduled run failed: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['pre-release-failure'],
              });
            }
